services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentpulse
      POSTGRES_PASSWORD: talentpulse
      POSTGRES_DB: talentpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentpulse -d talentpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: talentpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: talentpulse-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://talentpulse:talentpulse@postgres:5432/talentpulse
      DATABASE_READONLY_URL: postgresql://tp_readonly:tp_readonly@postgres:5432/talentpulse
      TEST_DATABASE_URL: postgresql://talentpulse:talentpulse@postgres:5432/talentpulse_test
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-token-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: dev-refresh-token-secret-at-least-32-chars-long
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      COOKIE_SECURE: "false"
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIM: 384
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: dev-ml-token
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: talentpulse-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ML_SERVICE_TOKEN: dev-ml-token
      MODELS_DIR: /app/models
    volumes:
      - ml_models_data:/app/models
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: talentpulse-worker
    restart: unless-stopped
    command: ["node", "-r", "tsconfig-paths/register", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://talentpulse:talentpulse@postgres:5432/talentpulse
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-token-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: dev-refresh-token-secret-at-least-32-chars-long
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: dev-ml-token

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: talentpulse-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000

volumes:
  postgres_data:
  redis_data:
  ml_models_data:
